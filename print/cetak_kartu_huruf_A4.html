<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cetak Kartu Bantu Huruf & Panduan (Ukuran 8,5 x 5,5 cm)</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 8mm;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #f8fafc;
    }
    .no-print-bar {
      background: #1e293b;
      padding: 16px 28px;
      border-radius: 12px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      max-width: 850px;
      border: 1px solid #334155;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 12px;
    }
    .btn {
      background: #e11d48;
      color: #ffffff;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #be123c;
      transform: translateY(-1px);
    }
    .sheet-a4 {
      width: 210mm;
      height: 297mm;
      background: #090d16;
      display: grid;
      grid-template-columns: repeat(3, 55mm);
      grid-template-rows: repeat(3, 85mm);
      gap: 1.5mm;
      justify-content: center;
      align-content: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      page-break-after: always;
      margin-bottom: 20mm;
      padding: 5mm;
    }
    .card-slot {
      width: 55mm;
      height: 85mm;
      border: 0.5px dashed #334155;
      overflow: hidden;
      border-radius: 3mm;
    }
    .card-slot img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
      margin: 15px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    @media print {
      body {
        background: transparent;
        padding: 0;
      }
      .no-print-bar, .section-title {
        display: none !important;
      }
      .sheet-a4 {
        margin: 0;
        box-shadow: none;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>
  <div class="no-print-bar">
    <h2 style="font-size: 20px; margin-bottom: 6px; color: #f43f5e;">SECRET MESSAGE — Kartu Bantu Kuantifikasi & Panduan</h2>
    <p>Ukuran standar kartu <strong>8,5 x 5,5 cm</strong> (9 kartu per lembar A4, siap potong & laminasi).</p>
    <div class="btn-group">
      <button class="btn" onclick="window.print()">🖨️ Cetak Kartu Bantu (Ctrl + P)</button>
    </div>
  </div>

  <div class="section-title">Lembar A4: 9x Kartu Bantu Huruf (H-01) untuk Seluruh Pemain</div>
  <div class="sheet-a4">
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
  </div>

  <div class="section-title">Lembar A4: Kartu Bantu Huruf (H-01) & Panduan Operasi (H-02) Kombinasi</div>
  <div class="sheet-a4">
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-01.jpeg" alt="H-01"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-02.jpeg" alt="H-02"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-02.jpeg" alt="H-02"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-02.jpeg" alt="H-02"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-02.jpeg" alt="H-02"></div>
    <div class="card-slot"><img src="../assets/images/cards/H-02.jpeg" alt="H-02"></div>
  </div>
</body>
</html>
